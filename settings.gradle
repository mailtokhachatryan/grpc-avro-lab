pluginManagement {
	repositories { gradlePluginPortal() }
}

dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		mavenCentral()
		exclusiveContent {
			forRepository {
				maven { url = uri('https://packages.confluent.io/maven/') }
			}
			filter {
				includeModuleByRegex 'io[.]confluent', 'kafka-.*|common-.*'
				includeModule 'io.confluent', 'rest-utils'
			}
		}
	}
}

rootProject.name = 'grpc-avro-lab'
include 'grpc-contract', 'grpc-server', 'grpc-client-java', 'avro-messaging'
