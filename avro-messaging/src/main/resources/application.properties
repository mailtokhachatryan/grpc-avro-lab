spring.application.name=avro-messaging
spring.main.web-application-type=none
spring.main.banner-mode=off
lab.messaging.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
lab.messaging.registry-url=${SCHEMA_REGISTRY_URL:http://127.0.0.1:8081}
lab.messaging.topic=${KAFKA_TOPIC:lab.messages}
lab.messaging.group=${KAFKA_GROUP_ID:lab-message-printer}
lab.messaging.timeout=${KAFKA_COMMAND_TIMEOUT:30s}
lab.messaging.request-timeout=${KAFKA_REQUEST_TIMEOUT:5s}
lab.messaging.poll-interval=${KAFKA_POLL_INTERVAL:250ms}
lab.messaging.close-timeout=${KAFKA_CLOSE_TIMEOUT:5s}
lab.messaging.registry-cache-capacity=${REGISTRY_CACHE_CAPACITY:128}
