name: grpc-avro-lab
services:
  kafka:
    image: confluentinc/cp-kafka:8.4.1
    ports:
      - "127.0.0.1:${LAB_KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: "${LAB_KAFKA_CLUSTER_ID:-mSdJeWG7QLGnmvC-FG8Odw}"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:${LAB_KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 15s
  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LAB_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8081
          printf 'GET /subjects HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r version status reason <&3
          test "$$status" = 200
      interval: 5s
      timeout: 7s
      retries: 18
      start_period: 15s
volumes:
  kafka-data:
