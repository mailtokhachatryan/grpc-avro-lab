spring.application.name=grpc-client-java
spring.main.web-application-type=none
spring.main.banner-mode=off
ping.client.host=${GRPC_HOST:127.0.0.1}
ping.client.port=${GRPC_PORT:8080}
ping.client.deadline=${GRPC_DEADLINE_MS:3000}ms
spring.grpc.client.channel.ping.target=static://${ping.client.host}:${ping.client.port}
spring.grpc.client.channel.ping.ssl.enabled=${GRPC_TLS_ENABLED:false}
