syntax = "proto3";

package ping.v1;

option java_package = "com.example.grpcavrolab.contract.ping.v1";
option java_multiple_files = true;
option java_outer_classname = "PingProto";

// A unary request/response exercise with exact Ping/Pong semantics.
service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
