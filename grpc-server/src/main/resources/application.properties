spring.application.name=grpc-server
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.grpc.server.address=${GRPC_HOST:127.0.0.1}
spring.grpc.server.port=${GRPC_PORT:8080}
spring.grpc.server.shutdown.grace-period=${GRPC_SHUTDOWN_GRACE_PERIOD:5s}
spring.grpc.server.inbound.message.max-size=${GRPC_MAX_MESSAGE_SIZE:16KB}
spring.grpc.server.reflection.enabled=${GRPC_REFLECTION_ENABLED:true}
spring.grpc.server.health.enabled=true
spring.grpc.server.health.schedule.delay=0s
spring.grpc.server.health.service[ping.v1.PingService].include=ping
